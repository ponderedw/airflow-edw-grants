<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDW Grants – Edit Role</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <span class="navbar-brand mb-0 h1">EDW Grants</span>
  <a class="nav-link text-white" href="{{ prefix }}/">← Back</a>
</nav>
<div class="container mt-4">
  <h2>Edit Role</h2>
  <form id="edit-role-form">
    <div class="form-group">
      <label>Role Name</label>
      <input type="text" name="role_name" class="form-control" value="{{ role_name }}" readonly>
    </div>
    <div class="form-group">
      <label>Roles</label>
      <select name="roles" multiple class="form-control select2">
        {% for role in all_roles %}
        <option value="{{ role }}" {% if role in current_roles %}selected{% endif %}>{{ role }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<script>
  const _prefix = "{{ prefix }}";

  $(document).ready(function () {
    $('.select2').select2({ placeholder: "Choose options", allowClear: true });

    $('#edit-role-form').on('submit', function (event) {
      event.preventDefault();
      const formData = new FormData(this);
      const roleName = formData.get('role_name');
      const roles = formData.getAll('roles');
      const url = `${_prefix}/edit_role_page/${encodeURIComponent(roleName)}/${roles.join(',')}`;
      fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role_name: roleName, roles: roles })
      })
      .then(response => response.json())
      .then(() => { window.location.href = `${_prefix}/`; });
    });
  });
</script>
</body>
</html>
