<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDW Grants – Add Role</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <span class="navbar-brand mb-0 h1">EDW Grants</span>
  <a class="nav-link text-white" href="{{ prefix }}/">← Back</a>
</nav>
<div class="container mt-4">
  <h2>Add a New Role</h2>
  <form method="POST" action="{{ prefix }}/add_role_page">
    <div class="form-group">
      <label>Role Name</label>
      <input type="text" name="role_name" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Roles</label>
      <select name="roles" multiple class="form-control select2">
        {% for role in all_roles %}
        <option value="{{ role }}">{{ role }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<script>
  $(document).ready(function () {
    $('.select2').select2({ placeholder: "Choose options", allowClear: true });
  });
</script>
</body>
</html>
