<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDW Grants – Add User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <span class="navbar-brand mb-0 h1">EDW Grants</span>
  <a class="nav-link text-white" href="{{ prefix }}/">← Back</a>
</nav>
<div class="container mt-4">
  <h2>Add a New User</h2>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ prefix }}/add_user_page">
    <div class="form-group">
      <label>User Name</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" class="form-control" required>
      <small class="form-text text-muted">Must contain uppercase, lowercase, and a digit.</small>
    </div>
    <div class="form-group">
      <label>Roles</label>
      <select name="roles" multiple class="form-control select2">
        {% for role in all_roles %}
        <option value="{{ role }}">{{ role }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Can Edit Database?</label>
      <label class="switch ml-2">
        <input type="checkbox" name="can_edit_database" value="on" class="switch-input">
        <span class="slider"></span>
      </label>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<style>
.switch {
  position: relative;
  display: inline-block;
  width: 34px;
  height: 20px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: .4s;
}
.slider:before {
  position: absolute;
  content: "";
  height: 16px; width: 16px;
  left: 2px; bottom: 2px;
  background-color: white;
  transition: .4s;
}
input:checked + .slider { background-color: #2196F3; }
input:checked + .slider:before { transform: translateX(14px); }
</style>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<script>
  $(document).ready(function () {
    $('.select2').select2({ placeholder: "Choose options", allowClear: true });
  });
</script>
</body>
</html>
